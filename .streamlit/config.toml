[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 20

[client]
# Keeps "Record a screencast" in the top-right menu and hides the developer
# items (Deploy, Rerun, Clear cache) so they stay out of a recording.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2C4BD1"
backgroundColor = "#F6F8F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2A2F"
